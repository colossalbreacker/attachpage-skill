name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Fail instead of skipping when the platform's credential manager cannot be used.
      REQUIRE_OS_STORE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unlocked keychain (macOS)
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci attachpage-ci.keychain
          security list-keychains -d user -s attachpage-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s attachpage-ci.keychain
          security unlock-keychain -p ci attachpage-ci.keychain
          security set-keychain-settings attachpage-ci.keychain

      - name: Secret Service (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-tools dbus-x11

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && node --test'

      - name: Test
        if: runner.os != 'Linux'
        run: node --test
